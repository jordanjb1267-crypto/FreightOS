name: NSS Stage-F Provider Runner Preflight

on:
  push:
    branches:
      - nss-stage-f-gold-bearing-confirmatory-v0.1
    paths:
      - 'experiments/nss-stage-f-runner/**'
      - '.github/workflows/nss-stage-f-provider-runner-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  phase-w:
    name: Phase W — exact evidence binding and runner preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download exact verified Stage-F evidence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10729029512/zip > "$RUNNER_TEMP/stage-f-verified.zip"
          echo 'b43f7bb6f2a158300c63ff0df9519de21a18e1005860490f4f97ac907ba52af8  '"$RUNNER_TEMP/stage-f-verified.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/stage-f-verified"
          unzip -q "$RUNNER_TEMP/stage-f-verified.zip" -d "$RUNNER_TEMP/stage-f-verified"
      - name: Run zero-receipt provider-runner preflight
        env:
          RUN_MODE: preflight
          STAGE_F_EVIDENCE_ROOT: ${{ runner.temp }}/stage-f-verified/stage-f-evidence
          PREFLIGHT_OUT: ${{ runner.temp }}/stage-f-runner-preflight
          EVIDENCE_DIR: ${{ runner.temp }}/stage-f-provider-empty
        run: node experiments/nss-stage-f-runner/runner-preflight.mjs
      - name: Upload exact Phase-W runner-preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: nss-stage-f-runner-preflight-phase-w
          path: ${{ runner.temp }}/stage-f-runner-preflight
          if-no-files-found: error
          retention-days: 30

  phase-v:
    name: Phase V — independent runner-preflight verification
    needs: phase-w
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download exact verified Stage-F evidence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10729029512/zip > "$RUNNER_TEMP/stage-f-verified.zip"
          echo 'b43f7bb6f2a158300c63ff0df9519de21a18e1005860490f4f97ac907ba52af8  '"$RUNNER_TEMP/stage-f-verified.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/stage-f-verified"
          unzip -q "$RUNNER_TEMP/stage-f-verified.zip" -d "$RUNNER_TEMP/stage-f-verified"
      - name: Download exact Phase-W runner-preflight evidence
        uses: actions/download-artifact@v4
        with:
          name: nss-stage-f-runner-preflight-phase-w
          path: ${{ runner.temp }}/stage-f-runner-preflight
      - name: Independently verify provider-runner preflight
        env:
          STAGE_F_EVIDENCE_ROOT: ${{ runner.temp }}/stage-f-verified/stage-f-evidence
          PREFLIGHT_ROOT: ${{ runner.temp }}/stage-f-runner-preflight
        run: node experiments/nss-stage-f-runner/verify-preflight.mjs
      - name: Upload independently verified runner-preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: nss-stage-f-runner-preflight-verified
          path: ${{ runner.temp }}/stage-f-runner-preflight
          if-no-files-found: error
          retention-days: 30
