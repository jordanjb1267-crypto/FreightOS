name: NSS Stage-C Zero-Call Preflight

on:
  push:
    branches:
      - nss-stage-c-safety-floor-confirmatory-v0.1
    paths:
      - 'experiments/nss-stage-c-preflight/**'
      - '.github/workflows/nss-stage-c-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-w-write:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Phase W — construct and write frozen candidate
        working-directory: experiments/nss-stage-c-preflight
        env:
          RUN_MODE: write
          EVIDENCE_DIR: ${{ runner.temp }}/nss1-stage-c-preflight-v0.2
        shell: bash
        run: |
          set -euo pipefail
          node preflight-v2.mjs | tee phase-w.log
      - name: Upload exact Phase-W evidence
        uses: actions/upload-artifact@v4
        with:
          name: nss-stage-c-v02-phase-w-evidence
          path: ${{ runner.temp }}/nss1-stage-c-preflight-v0.2
          if-no-files-found: error
          retention-days: 30
      - name: Upload Phase-W log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nss-stage-c-v02-phase-w-log
          path: experiments/nss-stage-c-preflight/phase-w.log
          if-no-files-found: warn
          retention-days: 30

  phase-v-verify:
    needs: phase-w-write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download exact Phase-W evidence
        uses: actions/download-artifact@v4
        with:
          name: nss-stage-c-v02-phase-w-evidence
          path: ${{ runner.temp }}/evidence
      - name: Assert evidence root
        shell: bash
        run: |
          set -euo pipefail
          test -f "${RUNNER_TEMP}/evidence/artifact-index.json"
          echo "EVIDENCE_ROOT=${RUNNER_TEMP}/evidence" >> "$GITHUB_ENV"
      - name: Phase V — independent readback and verification
        working-directory: experiments/nss-stage-c-preflight
        env:
          RUN_MODE: verify
          EVIDENCE_DIR: ${{ env.EVIDENCE_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          node preflight-v2.mjs | tee phase-v.log
      - name: Upload terminal verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nss-stage-c-v02-phase-v-terminal
          path: |
            ${{ env.EVIDENCE_ROOT }}/VERIFICATION_RESULT.json
            ${{ env.EVIDENCE_ROOT }}/FREEZE_POINTER.json
            experiments/nss-stage-c-preflight/phase-v.log
          if-no-files-found: warn
          retention-days: 30
